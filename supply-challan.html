<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Supply Challan</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #d9d9d9;
    font-family: 'Times New Roman', Times, serif;
    margin: 0;
    padding: 30px 0;
  }
  .toolbar {
    max-width: 700px;
    margin: 0 auto 15px;
    text-align: right;
  }
  .toolbar button {
    font-family: Arial, sans-serif;
    font-size: 13px;
    padding: 8px 16px;
    margin-left: 8px;
    border: 1px solid #444;
    background: #fff;
    cursor: pointer;
    border-radius: 4px;
  }
  .toolbar button:hover { background: #eee; }

  .sheet {
    max-width: 700px;
    margin: 0 auto;
    background: #fff;
    padding: 20px 22px 30px;
    border: 1px solid #999;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    font-size: 13px;
  }
  table { border-collapse: collapse; width: 100%; }
  td, th { border: 1px solid #000; padding: 4px 6px; vertical-align: top; }

  input, textarea {
    border: none;
    font-family: inherit;
    font-size: inherit;
    width: 100%;
    background: transparent;
    padding: 1px 2px;
  }
  input:focus, textarea:focus {
    outline: 1px dashed #999;
    background: #fffef0;
  }
  textarea { resize: vertical; overflow: hidden; }

  .header-table td { padding: 6px 8px; }
  .company-cell {
    text-align: center;
  }
  .company-cell .title {
    font-weight: bold;
    letter-spacing: 1px;
    font-size: 15px;
  }
  .company-cell input.company-name {
    text-align: center;
    font-weight: bold;
    font-size: 14px;
    margin-top: 8px;
  }
  .company-cell input.company-sub {
    text-align: center;
    font-weight: bold;
    font-size: 13px;
  }
  .meta-table td { width: 50%; }
  .meta-label { font-size: 11px; color: #333; }

  .buyer-box {
    border: 1px solid #000;
    border-top: none;
    padding: 6px 8px;
  }
  .buyer-box .label { font-weight: bold; margin-bottom: 2px; }
  .buyer-line { margin: 1px 0; }
  .work-desc {
    margin-top: 8px;
  }
  .work-desc .label { font-weight: bold; }
  .tender-no {
    margin-top: 8px;
    font-weight: bold;
  }

  .items-table th {
    text-align: center;
    font-size: 12px;
    font-weight: bold;
    background: #f5f5f5;
  }
  .items-table td.center { text-align: center; }
  .items-table td.sno { width: 30px; text-align: center; }
  .items-table td.sched { width: 55px; text-align: center; }
  .items-table td.unit { width: 55px; text-align: center; }
  .items-table td.qty { width: 65px; text-align: center; }

  .footer-line {
    margin-top: 10px;
    border: 1px solid #000;
    padding: 5px 8px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
  }
  .footer-line label { font-weight: bold; margin-right: 4px; }
  .footer-line input { display: inline-block; width: auto; min-width: 150px; }

  .signatures {
    margin-top: 30px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
  }
  .sig-block { width: 48%; }
  .sig-block .sig-title { font-weight: bold; margin-bottom: 40px; display:block; }
  .sig-block textarea {
    border-bottom: 1px solid #000;
    text-align: center;
  }
  .right-sig { text-align: right; }
  .right-sig .sig-title { text-align: right; }

  @media print {
    body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .sheet { box-shadow: none; border: none; max-width: 100%; }
    input:focus, textarea:focus { outline: none; background: transparent; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="addRow()">+ Add Item Row</button>
  <button onclick="window.print()">Print / Save as PDF</button>
</div>

<div class="sheet" id="sheet">

  <!-- Header -->
  <table class="header-table">
    <tr>
      <td colspan="1" rowspan="2" class="company-cell" style="width:45%;">
        <div class="title">SUPPLY CHALLAN</div>
        <br><br>
        <input class="company-name" value="NIRUPAN ELECTRICALS AND ENGINEERING">
        <input class="company-sub" value="SOLAPUR">
      </td>
      <td style="width:27.5%;">
        <div class="meta-label">Challan No:</div>
        <input value="NEE/2526/232">
      </td>
      <td style="width:27.5%;">
        <div class="meta-label">Dated:</div>
        <input value="27/01/2026">
      </td>
    </tr>
    <tr>
      <td>
        <div class="meta-label">Vehicle No:</div>
        <input value="MH13CT9184">
      </td>
      <td>
        <div class="meta-label">Other Reference</div>
        <input value="">
      </td>
    </tr>
    <tr>
      <td></td>
      <td>
        <div class="meta-label">Buyer's Order No:</div>
        <input value="">
      </td>
      <td>
        <div class="meta-label">LOA Dated:</div>
        <input value="">
      </td>
    </tr>
  </table>

  <!-- Buyer Box -->
  <div class="buyer-box">
    <div class="label">Buyer</div>
    <div class="buyer-line"><input value="Senior Section Engineer (E. M), KLBG"></div>
    <div class="buyer-line"><input value="Central Railway"></div>
    <div class="buyer-line"><input value="State Name: Karnataka"></div>
    <div class="buyer-line"><input value="Place of Supply: KLBG Store"></div>

    <div class="work-desc">
      <span class="label">Name of work:-</span>
      <textarea rows="3">Electrical general service portion of work in connection with the improvement of safety, reliable power supply, lightning, earthing arrangements and other ancillary works in the SUR-WD section over Solapur Division.</textarea>
    </div>

    <div class="tender-no">
      Tender No:- <input style="display:inline-block; width:auto; min-width:200px; font-weight:bold;" value="SUR-L-T-2025-24">
    </div>
  </div>

  <!-- Items Table -->
  <table class="items-table" id="itemsTable">
    <thead>
      <tr>
        <th style="width:30px;">Sr.<br>No</th>
        <th style="width:55px;">Schedule.<br>No</th>
        <th>Particular</th>
        <th style="width:55px;">Unit</th>
        <th style="width:65px;">Quantity</th>
      </tr>
    </thead>
    <tbody id="itemsBody">
      <tr><td class="sno">1</td><td class="sched"><input value="08"></td><td><input value="Exhaust fan (Sweep Size:-300mm) as per specification"></td><td class="unit"><input value="Nos"></td><td class="qty"><input value="20"></td></tr>
      <tr><td class="sno">2</td><td class="sched"><input value="17"></td><td><input value="Provision of 60W, LED flood lights as per specification"></td><td class="unit"><input value="Nos"></td><td class="qty"><input value="60"></td></tr>
      <tr><td class="sno">3</td><td class="sched"><input value="18"></td><td><input value="Provision of LED street light 30-33 W as per specification"></td><td class="unit"><input value="Nos"></td><td class="qty"><input value="40"></td></tr>
      <tr><td class="sno">4</td><td class="sched"><input value="19"></td><td><input value="Provision of 200W Non integral LED flood lights as per specification"></td><td class="unit"><input value="Nos"></td><td class="qty"><input value="10"></td></tr>
      <tr><td class="sno">5</td><td class="sched"><input value="20"></td><td><input value="LED panel light recess / surface mounted (2 feet X 2 feet) as per specification"></td><td class="unit"><input value="Nos"></td><td class="qty"><input value="40"></td></tr>
      <tr><td class="sno">6</td><td class="sched"><input value="23"></td><td><input value="Supply, Erection, Testing and commissioning of 36-40W LED tube light as per specification"></td><td class="unit"><input value="Nos"></td><td class="qty"><input value="160"></td></tr>
      <tr><td class="sno">7</td><td class="sched"><input value="25"></td><td><input value="SPS"></td><td class="unit"><input value="KG"></td><td class="qty"><input value="561"></td></tr>
      <tr><td class="sno">8</td><td class="sched"><input value=""></td><td><input value=""></td><td class="unit"><input value=""></td><td class="qty"><input value=""></td></tr>
      <tr><td class="sno">9</td><td class="sched"><input value=""></td><td><input value=""></td><td class="unit"><input value=""></td><td class="qty"><input value=""></td></tr>
      <tr><td class="sno">10</td><td class="sched"><input value=""></td><td><input value=""></td><td class="unit"><input value=""></td><td class="qty"><input value=""></td></tr>
    </tbody>
  </table>

  <!-- PAN / GST -->
  <div class="footer-line">
    <div><label>Company's PAN :</label><input value="AIZPK1122A"></div>
    <div><label>Company's GSTIN / UIN :</label><input value="27AIZPK1122A1ZI"></div>
  </div>

  <!-- Signatures -->
  <div class="signatures">
    <div class="sig-block">
      <input class="sig-title" value="Customer's Seal and Signature">
      <textarea rows="3">Senior Section Engineer Vidhyut
Madhya Rail, Kalaburagi
Senior Section Engineer Elect. (M)
Central Railway, Kalaburagi</textarea>
    </div>
    <div class="sig-block right-sig">
      <input class="sig-title" value="For Nirupan Electricals &amp; Engineering">
      <textarea rows="3">Authorised Signatory</textarea>
    </div>
  </div>

</div>

<script>
  let rowCount = document.querySelectorAll('#itemsBody tr').length;
  function addRow() {
    rowCount++;
    const tbody = document.getElementById('itemsBody');
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="sno">${rowCount}</td>
      <td class="sched"><input value=""></td>
      <td><input value=""></td>
      <td class="unit"><input value=""></td>
      <td class="qty"><input value=""></td>`;
    tbody.appendChild(tr);
  }
</script>

</body>
</html>
