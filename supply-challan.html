<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Supply Challan - V R CONSTRUCTION</title>
<style>
  * { box-sizing: border-box; }
  
  body {
    background: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 30px 0;
    color: #1e293b;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .toolbar {
    max-width: 800px;
    margin: 0 auto 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .toolbar-info {
    font-size: 12px;
    color: #64748b;
  }
  .toolbar button {
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    margin-left: 8px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    color: #334155;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.2s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .toolbar button:hover {
    background: #f8fafc;
    border-color: #94a3b8;
  }

  .sheet {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto;
    background: #ffffff;
    padding: 12mm 15mm;
    border: 1px solid #cbd5e1;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    font-size: 12px;
    line-height: 1.4;
    position: relative;
  }

  [contenteditable="true"]:hover {
    outline: 1px dashed #3b82f6;
    background-color: #eff6ff;
  }
